<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>S2 — Timing capture surface</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 2rem;
      }
      #hint {
        color: #555;
        margin-bottom: 0.5rem;
      }
      #surface {
        border: 2px solid #333;
        padding: 1rem 2rem;
        min-height: 3rem;
        font-size: 1.5rem;
      }
      #surface:focus {
        outline: 3px solid #06c;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <p id="hint">
      Click the box, then type. Capture records keydown/keyup timing; the echo is display-only.
    </p>
    <div id="surface" tabindex="0" aria-label="Typing capture surface"></div>
    <script>
      (function () {
        "use strict";
        var surface = document.getElementById("surface");
        window.__keyLog = [];
        window.__displayText = "";
        var t0 = null;

        function isPrintable(key) {
          return key.length === 1;
        }

        function isCombo(e) {
          return e.ctrlKey || e.altKey || e.metaKey;
        }

        function record(e) {
          if (t0 === null) {
            t0 = performance.now();
          }
          window.__keyLog.push({
            code: e.code,
            key: e.key,
            type: e.type === "keydown" ? "down" : "up",
            t: performance.now() - t0,
            mods: { shift: e.shiftKey, ctrl: e.ctrlKey, alt: e.altKey, meta: e.metaKey },
            repeat: e.repeat === true,
            isTrusted: e.isTrusted === true,
          });
        }

        function echo(e) {
          if (e.type !== "keydown") return;
          if (e.repeat) return;
          if (isCombo(e)) return;
          if (e.key === "Backspace") {
            window.__displayText = window.__displayText.slice(0, -1);
          } else if (isPrintable(e.key)) {
            window.__displayText += e.key;
          }
          surface.textContent = window.__displayText;
        }

        surface.addEventListener("keydown", function (e) {
          record(e);
          echo(e);
        });
        surface.addEventListener("keyup", function (e) {
          record(e);
        });
      })();
    </script>
  </body>
</html>
