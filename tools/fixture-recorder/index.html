<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The recorder itself makes no network requests. This CSP forbids them
         outright: if anything ever tries to phone home, the browser blocks it
         and the console shows the violation. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>RealType fixture recorder</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        max-width: 60rem;
        margin: 0 auto;
        padding: 1rem;
        line-height: 1.5;
      }
      #surface {
        min-height: 4rem;
        border: 2px solid currentColor;
        padding: 0.75rem;
        outline: none;
        font-family: ui-monospace, monospace;
        font-size: 1.1rem;
      }
      #surface:focus {
        border-style: dashed;
      }
      .prompt {
        font-family: ui-monospace, monospace;
        font-size: 1.25rem;
        padding: 0.75rem;
        border-left: 4px solid currentColor;
        margin: 0.5rem 0;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
        margin: 0.5rem 0;
      }
      button {
        font-size: 1rem;
        padding: 0.4rem 0.8rem;
      }
      #status {
        font-weight: bold;
      }
      .warn {
        border: 2px dashed;
        padding: 0.5rem;
        margin: 0.5rem 0;
      }
      @media (prefers-reduced-motion: no-preference) {
        button {
          transition: background-color 150ms ease-out;
        }
      }
    </style>
  </head>
  <body>
    <h1>RealType fixture recorder</h1>
    <p class="warn">
      Type ONLY the prompted text — never passwords, names, or personal content. The exported file
      records every keystroke with timing.
    </p>

    <div class="row">
      <label for="scenario">Scenario:</label>
      <select id="scenario"></select>
      <button id="prev" type="button">Previous</button>
      <button id="next" type="button">Next</button>
    </div>

    <div class="row">
      <label for="layout">Keyboard layout:</label>
      <select id="layout">
        <option value="qwerty-us">QWERTY-US</option>
        <option value="qwerty-uk">QWERTY-UK</option>
        <option value="dvorak">Dvorak</option>
        <option value="colemak-dh">Colemak-DH</option>
        <option value="azerty">AZERTY</option>
        <option value="qwertz">QWERTZ</option>
      </select>
      <label for="note">Keyboard model / note:</label>
      <input id="note" type="text" placeholder="e.g. laptop, 60%, external" />
    </div>

    <h2 id="sc-title"></h2>
    <p id="sc-instruction"></p>
    <div class="prompt" id="sc-prompt"></div>

    <div class="row">
      <button id="start" type="button">Start capture</button>
      <button id="export" type="button" disabled>Export JSON</button>
      <span id="status">idle</span>
    </div>

    <div id="surface" tabindex="0" aria-label="Typing capture surface"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
