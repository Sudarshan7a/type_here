name: CI

on:
  push: # all branches — task branches run CI before they are merged to main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0 # reads the packageManager pin from package.json

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: "Unit tests (per-package coverage gates: engine/schemas 85%)"
        run: pnpm test

      - name: Build all packages
        run: pnpm build

      - name: Bundle-size check (200 KB gzip budget, test page JS)
        run: pnpm check:bundle

      - name: Feature-ledger integrity (counts, status vocabulary, evidence)
        run: |
          pnpm check:ledger
          node --test scripts/check-ledger.test.mjs

      - name: Product-policy gate (INT-10, BIZ-06, RET-21)
        run: |
          pnpm check:policies
          node --test scripts/check-policies.test.mjs

      - name: "Coordination gate (scope conflicts, dependency cycles, log integrity)"
        run: |
          pnpm check:coordination
          node --test scripts/check-coordination.test.mjs

      - name: Dev-stack start-up gate (F1, F2, F3, F9)
        run: |
          pnpm check:devstack
          node --test scripts/dev-stack.test.mjs

      - name: E2E smoke (Chromium)
        run: |
          pnpm --dir e2e exec playwright install --with-deps chromium
          pnpm e2e

      - name: Dependency audit (production)
        run: pnpm audit --prod

      - name: License check (copyleft gate on production dependencies)
        run: |
          pnpm check:licenses
          node --test scripts/check-licenses.test.mjs

      - name: "Content-licence gate (CNT-07: no GPL/AGPL corpus content, every item licensed)"
        run: |
          pnpm check:content-licenses
          node --test scripts/check-content-licenses.test.mjs

      - name: "Corpus pipeline gate (CNT-01: licence per item, dedupe, PII/secret filter, tags)"
        # Deliberately does NOT run build:corpus. The gate rebuilds from docs/ and
        # fails on drift, so regenerating here would hide exactly the staleness
        # this step exists to catch.
        run: |
          pnpm check:corpus
          node --test scripts/corpus-pipeline.test.mjs scripts/check-corpus.test.mjs
